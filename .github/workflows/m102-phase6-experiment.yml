name: M1-02 isolated HMAC Phase-6 PostgreSQL spike
on:
  push:
    branches:
      - experiment/m102-hmac-phase6-proof-20261115
permissions:
  contents: read
jobs:
  phase6-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolated scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "experiment/m102-hmac-phase6-proof-20261115"
          test -z "$(find migrations/tenant_plane/versions -maxdepth 1 -name 'tp000[8-9]*.py' -print)"
          docker info >/dev/null
      - name: Install existing development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run isolated PG15 phase-6 experiment and existing regression
        shell: bash
        env:
          M0_REQUIRE_DOCKER: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/unit tests/integration -v --tb=short -rs --junitxml=phase6-spike-junit.xml | tee phase6-spike-pytest.txt
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m102-phase6-experiment
          path: |
            phase6-spike-junit.xml
            phase6-spike-pytest.txt
          if-no-files-found: warn
