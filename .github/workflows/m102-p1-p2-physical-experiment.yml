name: M1-02 P1/P2 HMAC physical experiment

on:
  push:
    branches:
      - cursor/m102-p1-p2-hmac-physical-experiment-95a4
      - cursor/m102-p1-p2-n01-n09-corrections-95a4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-p2-physical:
    name: Disposable PG15 P1 vs P2 physical evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify experimental scope (no official TP0008+)
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            cursor/m102-p1-p2-hmac-physical-experiment-95a4|cursor/m102-p1-p2-n01-n09-corrections-95a4) ;;
            *) echo "unexpected branch $GITHUB_REF_NAME"; exit 1 ;;
          esac
          test -z "$(find migrations/tenant_plane/versions -maxdepth 1 -name 'tp000[8-9]*.py' -print)"
          test -z "$(find migrations/tenant_plane/versions -maxdepth 1 -name 'tp001*.py' -print)"
          test -d experiments/m102_hmac_physical
          docker info >/dev/null

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit + integration suite (exclude corrected-invariant isolation file)
        shell: bash
        env:
          M0_REQUIRE_DOCKER: "1"
        run: |
          set -euo pipefail
          python -m pytest tests/unit tests/integration \
            --ignore=tests/integration/test_m102_corrected_safety_invariants.py \
            -v --tb=short -rs --junitxml=m102-p1-p2-junit.xml | tee m102-p1-p2-pytest.txt

      - name: Run corrected safety invariants in fresh Testcontainers session
        shell: bash
        env:
          M0_REQUIRE_DOCKER: "1"
        run: |
          set -euo pipefail
          python -m pytest tests/integration/test_m102_corrected_safety_invariants.py \
            -v --tb=short -rs --junitxml=m102-safety-junit.xml | tee m102-safety-pytest.txt

      - name: Summarize required experiment nodes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          required_exact = [
            "test_p1_deterministic_old_new_writer_conflict_on_gen2",
            "test_p1_atomic_dual_write_rejects_active_hmac_mismatch",
            "test_p1_two_complete_rotations_preserve_active_authority",
            "test_p1_invalid_generation_index_recovery_on_real_target",
            "test_p1_invalid_index_cleanup_and_retry",
            "test_p1_unsafe_upgrade_head_fail_closed",
            "test_p2_deterministic_candidate_writer_conflict",
            "test_p2_active_uniqueness_person_consistency_and_two_cycles",
            "test_fresh_install_then_experimental_expand",
            "test_upgrade_path_populated_then_expand_and_backfill",
            "test_phase_gate_blocks_skip_to_index_and_phase9_not_operational",
            "test_no_official_tp0008_plus_committed_on_this_branch",
            "test_p1_phase6_index_targets_gen2_not_lookup_hmac_next",
            "test_p2_candidate_and_active_indexes_are_status_scoped",
          ]
          required_parametrized = {
            "test_p1_expand_preserves_tp0002_indexes_and_adds_nonredundant_gen2": [
              "cloud_tenant", "local_hub"
            ],
            "test_p2_sidecar_expand_rls_and_nonredundant_candidate_index": [
              "cloud_tenant", "local_hub"
            ],
          }
          required_safety = [
            "test_n01_closed_cannot_wipe_or_drop_active_gen2_after_cutover",
            "test_n02_n03_closed_active_index_and_person_mismatch_rejected",
            "test_n05_closed_phase_gate_rejects_evidenceless_transitions",
          ]

          main = ET.parse("m102-p1-p2-junit.xml").getroot().findall(".//testcase")
          safety = ET.parse("m102-safety-junit.xml").getroot().findall(".//testcase")
          by_name = {c.attrib.get("name"): c for c in main}
          by_name.update({c.attrib.get("name"): c for c in safety})

          missing = []
          checked = []
          for n in required_exact + required_safety:
            if n not in by_name:
              missing.append(n)
            else:
              checked.append(by_name[n])
          for base, planes in required_parametrized.items():
            for plane in planes:
              name = f"{base}[{plane}]"
              if name not in by_name:
                missing.append(name)
              else:
                checked.append(by_name[name])
          if missing:
            raise SystemExit("missing required nodes:\n" + "\n".join(missing))
          for c in checked:
            name = c.attrib.get("name")
            if c.find("failure") is not None or c.find("error") is not None:
              raise SystemExit(f"required failed: {name}")
            if c.find("skipped") is not None:
              raise SystemExit(f"required skipped: {name}")
          all_cases = main + safety
          failed = sum(
            1 for c in all_cases
            if c.find("failure") is not None or c.find("error") is not None
          )
          skipped = sum(1 for c in all_cases if c.find("skipped") is not None)
          if failed or skipped:
            raise SystemExit(f"suite not clean: failed={failed} skipped={skipped}")
          print(
            f"OK required={len(checked)} total={len(all_cases)} "
            f"failed={failed} skipped={skipped}"
          )
          Path("m102-p1-p2-summary.txt").write_text(
              f"required={len(checked)}\ntotal={len(all_cases)}\n"
              f"failed={failed}\nskipped={skipped}\n"
              f"acceptance_status=EXPERIMENTAL_CORRECTIONS_TESTED_NOT_APPROVED\n",
              encoding="utf-8",
          )
          PY

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m102-p1-p2-physical-evidence
          path: |
            m102-p1-p2-junit.xml
            m102-p1-p2-pytest.txt
            m102-safety-junit.xml
            m102-safety-pytest.txt
            m102-p1-p2-summary.txt
          if-no-files-found: warn
