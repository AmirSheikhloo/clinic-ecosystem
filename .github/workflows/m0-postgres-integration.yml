name: M0 PostgreSQL integration

on:
  push:
    branches:
      - cursor/gate-a-m0-bootstrap-95a4
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0-postgres:
    name: PostgreSQL 15 Testcontainers evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report Python version
        run: |
          python --version
          python -c "import sys; print(sys.version)"

      - name: Verify Docker daemon
        run: |
          set -euo pipefail
          docker version
          docker info
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker daemon is unavailable on this runner"
            exit 1
          fi

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Collect tests (must discover required suites)
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/unit tests/integration --collect-only -q | tee m0-collect.txt
          python .github/scripts/assert_m0_pytest_evidence.py --mode collect --collect-log m0-collect.txt

      - name: Run unit and required integration/migration tests
        shell: bash
        env:
          M0_REQUIRE_DOCKER: "1"
          # Ryuk is optional; keep default enabled when the daemon supports it.
        run: |
          set -euo pipefail
          python -m pytest tests/unit tests/integration -v --tb=short -rs \
            --junitxml=m0-junit.xml | tee m0-pytest.txt

      - name: Assert required suites executed (no silent skips)
        run: |
          python .github/scripts/assert_m0_pytest_evidence.py \
            --mode junit \
            --junit m0-junit.xml \
            --pytest-log m0-pytest.txt

      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-postgres-pytest-evidence
          path: |
            m0-collect.txt
            m0-pytest.txt
            m0-junit.xml
          if-no-files-found: warn
