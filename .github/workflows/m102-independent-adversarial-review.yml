name: M1-02 independent adversarial P1/P2 counterexamples

on:
  push:
    branches:
      - audit/m102-cursor-adversarial-20261116

permissions:
  contents: read

jobs:
  adversarial-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm branch and disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/m102-cursor-adversarial-20261116"
          test -z "$(find migrations/tenant_plane/versions -maxdepth 1 \( -name 'tp000[8-9]*.py' -o -name 'tp001*.py' \) -print)"
          docker info >/dev/null
      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run original suite in clean first pytest session
        shell: bash
        env:
          M0_REQUIRE_DOCKER: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/unit tests/integration \
            --ignore=tests/integration/test_m102_adversarial_counterexamples.py \
            -v --tb=short -rs --junitxml=m102-original-junit.xml | tee m102-original-pytest.txt
      - name: Run risk-confirming negative counterexamples in NEW pytest session
        shell: bash
        env:
          M0_REQUIRE_DOCKER: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/integration/test_m102_adversarial_counterexamples.py \
            -v --tb=short -rs --junitxml=m102-risk-junit.xml | tee m102-risk-pytest.txt
      - name: Verify original suite and negative observations separately
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          old = ET.parse('m102-original-junit.xml').getroot().findall('.//testcase')
          risk = ET.parse('m102-risk-junit.xml').getroot().findall('.//testcase')
          required={
            'test_adversarial_p1_cutover_then_rollback_removes_active_gen2_authority',
            'test_adversarial_p2_active_status_has_no_unique_index_and_person_mismatch',
            'test_adversarial_phase_gate_can_cutover_without_evidence_or_enforce_phase9_flag'
          }
          assert {x.get('name') for x in risk} == required
          for group in (old, risk):
            assert all(all(c.find(x) is None for x in ['failure','error','skipped']) for c in group)
          assert len(old) == 87, len(old)
          assert len(risk) == 3, len(risk)
          report=(
            f'original_suite_PASS={len(old)}; counterexamples_CONFIRMED={len(risk)}; '
            'failed=0; skipped=0; acceptance_status=BLOCKED\n'
          )
          Path('m102-independent-review-summary.txt').write_text(report)
          print(report)
          PY
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m102-adversarial-p1-p2-risk-evidence
          path: |
            m102-original-junit.xml
            m102-original-pytest.txt
            m102-risk-junit.xml
            m102-risk-pytest.txt
            m102-independent-review-summary.txt
          if-no-files-found: warn
