name: M1-02 independent multi-tenant gate adversarial review
on:
  push:
    branches:
      - audit/m102-multitenant-evidence-20261116
permissions:
  contents: read
jobs:
  multi-tenant-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce independent and disposable scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/m102-multitenant-evidence-20261116"
          test -z "$(find migrations/tenant_plane/versions -maxdepth 1 \( -name 'tp000[8-9]*.py' -o -name 'tp001*.py' \) -print)"
          docker info >/dev/null
      - name: Install existing development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused independent negative tests on disposable PG15
        shell: bash
        env:
          M0_REQUIRE_DOCKER: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/integration/test_m102_review_counterexamples.py \
            -v --tb=short -rs --junitxml=m102-multitenant-audit-junit.xml | tee m102-multitenant-audit-pytest.txt
      - name: Fail closed if negative evidence is missing or skipped
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases=ET.parse("m102-multitenant-audit-junit.xml").getroot().findall(".//testcase")
          expected={
            "test_negative_global_cutover_passes_after_only_one_of_two_tenants_backfilled",
            "test_negative_evidence_log_is_mutable_and_erasable_by_experiment_migrator",
          }
          assert {c.get("name") for c in cases} == expected
          assert all(all(c.find(t) is None for t in ["failure","error","skipped"]) for c in cases)
          Path("m102-multitenant-audit-summary.txt").write_text(
            "negative_counterexamples_confirmed=2; status=EXPERIMENT_GAPS; approval=BLOCKED\n"
          )
          print(Path("m102-multitenant-audit-summary.txt").read_text())
          PY
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m102-independent-multitenant-evidence
          path: |
            m102-multitenant-audit-junit.xml
            m102-multitenant-audit-pytest.txt
            m102-multitenant-audit-summary.txt
          if-no-files-found: warn
