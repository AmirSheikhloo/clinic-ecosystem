name: M102 F2-B E0.4 forensic reconciliation

on:
  push:
    branches:
      - "experiment/m102-f2b-e04-*"
    paths:
      - "experiments/m102_f2b_bounded_e04/**"
      - ".github/workflows/m102-f2b-bounded-e04.yml"
      - "!experiments/m102_f2b_bounded_e04/evidence/**"

permissions:
  contents: read

jobs:
  f2b-e04-forensic:
    name: Disposable PG15 E0.4 forensic suite
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synth-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Authorization clock and attempt gate
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          python3 - <<'PY'
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          bound = datetime(2026, 11, 30, 22, 59, 0, tzinfo=timezone.utc)
          print("now_utc=", now.isoformat())
          if now >= bound:
              raise SystemExit("E0.4 authorization expired")
          PY

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify branch and full-range allowlist BEFORE SQL
        shell: bash
        env:
          E04_PARENT_COMMIT_SHA: 0145b3fd114a022dd004a3a36be43a9a0994a9b5
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            experiment/m102-f2b-e04-*) ;;
            *) echo "unexpected branch $GITHUB_REF_NAME"; exit 1 ;;
          esac
          test -d experiments/m102_f2b_bounded_e04
          test -f .github/workflows/m102-f2b-bounded-e04.yml
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "experiments/m102_f2b_bounded_e04")
          from harness.path_guard import assert_repo_range_allowlisted, PathAllowlistError
          parent = os.environ["E04_PARENT_COMMIT_SHA"]
          head = os.environ["GITHUB_SHA"]
          try:
              paths = assert_repo_range_allowlisted(parent=parent, head=head)
          except PathAllowlistError as exc:
              raise SystemExit(str(exc))
          print("allowlisted_paths=")
          for p in paths:
              print(p)
          if not paths:
              raise SystemExit("empty diff unexpectedly")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg2-binary>=2.9" "alembic>=1.13" "SQLAlchemy>=2.0" "pytest>=8.0"

      - name: Run E0.4 inherited + validator suite
        env:
          EXP_E04_ADMIN_DSN: postgresql://postgres:synth-ci-only@localhost:5432/postgres
          EXP_E04_DATABASE_URL: postgresql://postgres:synth-ci-only@localhost:5432/exp_e03
          E04_PARENT_COMMIT_SHA: 0145b3fd114a022dd004a3a36be43a9a0994a9b5
          E04_TESTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p experiments/m102_f2b_bounded_e04/evidence
          python -m pytest experiments/m102_f2b_bounded_e04/tests \
            -v --tb=short -rs \
            --junitxml=experiments/m102_f2b_bounded_e04/evidence/junit.xml \
            | tee experiments/m102_f2b_bounded_e04/evidence/pytest.txt

      - name: Independent post-pytest forensic verifier (mandatory gate)
        env:
          E04_TESTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python experiments/m102_f2b_bounded_e04/scripts/post_pytest_forensic_verify.py \
            | tee experiments/m102_f2b_bounded_e04/evidence/forensic_verifier.txt

      - name: Summarize outcomes and refuse skips
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          junit = Path("experiments/m102_f2b_bounded_e04/evidence/junit.xml")
          if not junit.exists():
              raise SystemExit("missing junit")
          cases = ET.parse(junit).getroot().findall(".//testcase")
          failed = sum(1 for c in cases if c.find("failure") is not None or c.find("error") is not None)
          skipped = sum(1 for c in cases if c.find("skipped") is not None)
          print(f"total={len(cases)} failed={failed} skipped={skipped}")
          Path("experiments/m102_f2b_bounded_e04/evidence/summary.txt").write_text(
              f"total={len(cases)}\nfailed={failed}\nskipped={skipped}\n"
              f"acceptance_status=E04_CI_AND_FORENSIC_CHECKS_PENDING_CLASSIFICATION\n",
              encoding="utf-8",
          )
          if failed or skipped:
              raise SystemExit("suite not clean")
          if len(cases) < 1:
              raise SystemExit("no tests collected")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m102-f2b-e04-evidence
          path: experiments/m102_f2b_bounded_e04/evidence/**
          if-no-files-found: warn
