name: M1-02 independent N05 evidence semantics negative tests
on:
  push:
    branches:
      - audit/m102-n05-evidence-bypass-20261116
permissions:
  contents: read
jobs:
  n05-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce disposable scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/m102-n05-evidence-bypass-20261116"
          test -z "$(find migrations/tenant_plane/versions -maxdepth 1 \( -name 'tp000[8-9]*.py' -o -name 'tp001*.py' \) -print)"
          docker info >/dev/null
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run ONLY N05 adversarial counterexamples in fresh Testcontainers
        shell: bash
        env:
          M0_REQUIRE_DOCKER: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/integration/test_m102_n05_evidence_adversarial.py \
            -v --tb=short -rs --junitxml=m102-n05-junit.xml | tee m102-n05-pytest.txt
      - name: Enforce both counterexamples ran without skips
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          t=ET.parse("m102-n05-junit.xml").getroot().findall(".//testcase")
          expected={
            "test_negative_n05_can_cutover_without_real_drain_backfill_or_generation_index",
            "test_negative_n05_evidence_false_attested_and_history_mutable"
          }
          assert {c.get("name") for c in t} == expected
          assert all(all(c.find(x) is None for x in ("failure","error","skipped")) for c in t)
          Path("m102-n05-summary.txt").write_text("negative_counterexamples_confirmed=2; acceptance=BLOCKED; no production acceptance\n")
          print(Path("m102-n05-summary.txt").read_text())
          PY
      - name: Upload negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m102-n05-independent-adversarial-evidence
          if-no-files-found: warn
          path: |
            m102-n05-junit.xml
            m102-n05-pytest.txt
            m102-n05-summary.txt
